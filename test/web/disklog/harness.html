<!doctype html>
<meta charset="utf-8">
<title>SavvyDiskLog test harness</title>
<script src="/wasm/disklog/disklog.js"></script>
<script>
  // Events from the module, for the tests to read.
  window.events = [];
  SavvyDiskLog.configure({ swUrl: '/wasm/disklog/disklog-sw.js' });
  SavvyDiskLog.setListener((e) => window.events.push(e));
  // Origin-private folder for the tests (stands in for the folder the user picks).
  window.opfsDir = async (name) => {
    const root = await navigator.storage.getDirectory();
    return root.getDirectoryHandle(name, { create: true });
  };
  window.readOpfs = async (dir, name) => {
    const d = await window.opfsDir(dir);
    const f = await (await d.getFileHandle(name)).getFile();
    return f.text();   // ASCII CSV: one char per byte
  };
</script>
<button id="go">go</button>
